services:
  - type: web
    name: gta6-shorts-engine
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: FAIL_CLOSED_IN_PRODUCTION
        value: "true"
      - key: ENGINE_API_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CORS_ORIGINS
        value: "https://lovable.dev,https://lovable.app"
      - key: REDIS_URL
        fromService:
          type: redis
          name: gta6-shorts-redis
          property: connectionString

  - type: worker
    name: gta6-shorts-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: FAIL_CLOSED_IN_PRODUCTION
        value: "true"
      - key: ENGINE_API_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: gta6-shorts-redis
          property: connectionString
      - key: OUTPUT_DIR
        value: /opt/render/project/src/output
      - key: TEMP_DIR
        value: /opt/render/project/src/tmp

  - type: redis
    name: gta6-shorts-redis
    plan: starter
    ipAllowList: []

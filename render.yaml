# Render blueprint for the studio backend: managed PostgreSQL, Key Value (Redis), the API and the worker.
# Storage is Supabase Storage (private bucket) because Render disks cannot be shared between services.
services:
  - type: web
    name: studio-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: python -m app.migrate
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: studio-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: studio-redis, property: connectionString }
      - key: STORAGE_BACKEND
        value: supabase
      - key: AUTH_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: studio-private
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: YOUTUBE_RETRIEVAL_ENABLED
        value: "false"
      - key: MAX_UPLOAD_BYTES
        value: "524288000"
      - key: MAX_SOURCE_DURATION_SECONDS
        value: "1800"

  - type: worker
    name: studio-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: studio-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: studio-redis, property: connectionString }
      - key: STORAGE_BACKEND
        value: supabase
      - key: AUTH_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: studio-private
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_PARALLEL_RENDERS
        value: "2"
      - key: WHISPER_MODEL
        value: base
      - key: WHISPER_COMPUTE_TYPE
        value: int8

  - type: keyvalue
    name: studio-redis
    ipAllowList: []
    plan: starter
    maxmemoryPolicy: noeviction

databases:
  - name: studio-db
    plan: basic-1gb
    databaseName: studio

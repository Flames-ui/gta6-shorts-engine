services:
  # ---------------------------------------------------------------------------
  # Combined Web & Worker Service (FastAPI API + Redis RQ Background Worker)
  # ---------------------------------------------------------------------------
  - type: web
    name: gta6-shorts-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FAIL_CLOSED_IN_PRODUCTION
        value: 'true'
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: '8000'
      - key: CORS_ORIGINS
        value: 'https://lovable.dev,https://lovable.app'
      - key: PUBLISHING_AUTOMATION_ENABLED
        value: 'false'

      # Authentication & Encryption Keys (Server-controlled)
      - key: ENGINE_API_KEY
        generateValue: true
      - key: ENGINE_API_KEY_PREVIOUS
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_USER_IDS
        sync: false
      - key: ADMIN_EMAILS
        sync: false

      # Supabase Integration (PostgreSQL Database, Auth & Private Media Storage)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: shorts

      # Shared Private Redis Queue (Single-instance combined queue)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gta6-shorts-redis
          property: connectionString
      - key: QUEUE_NAME
        value: viral-shorts
      - key: MAX_CONCURRENT_JOBS
        value: '2'
      - key: JOB_TIMEOUT_SECONDS
        value: '1800'

      # AI Provider Credentials (Gemini primary, OpenAI fallback)
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # Buffer Social Publishing Integration (OAuth 2.0)
      - key: BUFFER_CLIENT_ID
        sync: false
      - key: BUFFER_CLIENT_SECRET
        sync: false
      - key: BUFFER_REDIRECT_URI
        sync: false

      # YouTube Data API Direct Publishing (OAuth 2.0)
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REDIRECT_URI
        sync: false

      # Local Whisper & Video Processing Settings
      - key: LOCAL_WHISPER_MODEL
        value: base
      - key: LOCAL_WHISPER_DEVICE
        value: cpu
      - key: OUTPUT_DIR
        value: /app/output
      - key: LOCAL_OUTPUT_DIR
        value: /app/output
      - key: TEMP_DIR
        value: /app/tmp
      - key: DAILY_TARGET_MIN
        value: '15'
      - key: DAILY_TARGET_MAX
        value: '20'

  # ---------------------------------------------------------------------------
  # Private Redis (Task Queue & Distributed Locks)
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: gta6-shorts-redis
    plan: starter
    ipAllowList: []
